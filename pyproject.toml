[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capa-ai-match-backend"
version = "0.1.0"
description = "Independent hybrid retrieval service"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi==0.162.5", "uvicorn==0.54.0", "python-dotenv==1.2.4", "openpyxl==3.1.5", "numpy==2.2.6", "chromadb==1.5.9", "onnxruntime==1.31.1", "sentence-transformers==5.7.0", "filelock==4.2.10"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]
databricks = ["databricks-sdk>=0.89,<1"]

[project.scripts]
match-api = "capa_match.cli:serve"
match-import = "capa_match.cli:import_source"
match-build = "capa_match.build:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["capa_match*", "match_v1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: opt-in heavy local index/model integration checks"]
